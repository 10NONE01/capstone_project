
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Mobile Auto Basics</title>

    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="brand">
                <img src="assets/images/logo.png"
                     alt="Mobile Auto Basics Logo"
                     class="logo">

                <h2>Mobile Auto Basics</h2>
            </div>

            <div class="nav-links">
                <a href="index.html">Back to Home</a>
            </div>

        </nav>
    </header>

    <!-- Login Section -->
    <main class="login-page">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p>Sign in to your Mobile Auto Basics account.</p>

            <!-- Login Form -->
            <form id="login-form">

                <!-- Role selection for capstone RBAC testing -->
                <label for="login-role">Sign in as</label>

                <select id="login-role" name="role" required>
                    <option value="customer">Customer</option>
                    <option value="mechanic">Mechanic</option>
                </select>

                <!-- Email -->
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
                <!-- Password -->
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <!-- Login Feedback -->
            <p id="login-message"
               role="status"
               aria-live="polite">
            </p>

        </div>

    </main>

</body>

</html>
